<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Calculadora Simples</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous" />
</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%;">
        <h3 class="text-center mb-4">Calculadora</h3>

        <div class="row g-3 mb-3">
            <div class="col">
                <input id="num1" type="number" class="form-control" placeholder="Número 1" aria-label="Número 1" />
            </div>
            <div class="col">
                <input id="num2" type="number" class="form-control" placeholder="Número 2" aria-label="Número 2" />
            </div>
        </div>

        <div class="d-grid mb-3">
            <button type="button" id="btnSomar" class="btn btn-primary">Somar</button>
        </div>

        <div class="alert alert-success text-center d-none" id="resultado">
            Resultado: <span id="valorResultado"></span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <script src="./script.js"></script>
</body>
</html>
